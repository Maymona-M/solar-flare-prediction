$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: solar-flare-env
version: 1
description: Environment for solar flare prediction training
image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
conda_file:
  name: solar-flare-env
  channels:
    - defaults
    - conda-forge
  dependencies:
    - python=3.9
    - numpy
    - pandas
    - scikit-learn
    - matplotlib
    - seaborn
    - Pillow
    - joblib
    - tqdm
    - pip
    - pip:
      - torch==2.0.1
      - torchvision==0.15.2
      - azureml-mlflow
      - mlflow
